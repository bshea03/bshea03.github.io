server {
    listen 80;
    server_name bradyshea.dev www.bradyshea.dev;

    # Allow Certbot renewal challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bradyshea.dev www.bradyshea.dev;

    ssl_certificate /etc/letsencrypt/live/bradyshea.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bradyshea.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and auth routes to backend
    location ~ ^/(v1|login|health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
